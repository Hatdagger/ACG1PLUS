# RAM map for every disc we map: Master of Arena US disc 1 (MoA-US, SLUS-01030 v1.0) and Project
# Phantasma US (PP, SLUS-00670). Source of truth for ram-map.md (MoA-US) and ram-map-pp.md (PP).
# Regenerate the docs with:  python3 tools/ram_map.py  and  python3 tools/ram_map.py --disc PP
#
# One [[var]] per named address. Fields:
#   addr    RAM address (0x80xxxxxx)
#   size    bytes (for arrays/records: the whole span)
#   type    u8 / u16 / u32 / s16 / ptr / bytes / struct / u8[n] …
#   name    short snake_case name, unique per disc; the name code should use
#   disc    which game disc the address is for: MoA-US (SLUS-01030 v1.0), PP (Project Phantasma US,
#           SLUS-00670), MoA-JP, AC1. Same name on two discs = the same thing on each.
#   moa     (PP rows) the MoA-US address of the same thing, when carried over by tools/xdisc/ram_xlate.py
#   what    one line, plain words
#   status  tested  = checked in a running game
#           code    = read from the game's code (static)
#           cheat   = from cheat codes only, not yet seen in code
#           guess   = inferred, needs a check
#   src     where the detail lives (docs/research/…)
#   owner   game (default) or lib (PsyQ library state: never touch)
#
# Region rules (from mapping/boot-loads.md, rule 1): only 0x80011000 … 0x80050DD8 (exe image + bss)
# survives module loads. Everything above 0x80050DD8 is rebuilt on every module load, so its
# addresses depend on which engine is loaded (menu FDAT 206, missions 207, link 208, VS 209, arena 210).
# On PP the module area starts at 0x800490D0 (menu FDAT 201, missions 202, link 203, VS 204, arena 205,
# replay 206); module rows name their engine in [brackets] at the start of "what" on both discs.

