# Builds the ACG1PLUS launcher (launcher2/) on GitHub and puts it on a TEST pre-release.
#
# Started by hand only (Actions -> "Launcher test release" -> Run workflow). The owner
# approves each run: the old rule "don't start workflow runs unless asked" still holds.
#
# Only the launcher is built here. It has no game code in it; the game itself is never
# built on GitHub (docs/no-game-code.md). The job stops if game code or disc files are
# found in the branch it builds.
#
# What it makes: a pre-release tagged test-launcher-<launcher2/VERSION> (or the tag typed
# in). The files come from the branch's own launcher2/release.sh when it has one (from
# launcher 0.2.2: both launchers, the source zip acg1plus-source-<version>.zip the
# launcher builds the game from, manifest.json and SHA256SUMS.txt), so changing what
# a release holds doesn't need a change here. Branches without that script get the
# 0.2.1 files: ACG1PLUS.exe, ACG1PLUS and SHA256SUMS.txt.
# Running it again for the same tag replaces the files. Release notes come from
# launcher2/test-notes.md on that branch (only that build's changes).
name: Launcher test release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build (main, or a pull request branch)"
        required: true
        default: "main"
      tag:
        description: "Tag (leave empty for test-launcher-<launcher2/VERSION>)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: launcher-test-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false

      - name: No game code in the branch
        run: |
          bad="$(git ls-files | grep -E '(^|/)generated(-jp)?/|overlays_static|(^|/)(SLUS|SLPS|SCUS)_[0-9]|(^|/)SYSTEM\.CNF$|\.(bin|cue|iso|chd)$' || true)"
          if [ -n "$bad" ]; then
            echo "Game code or disc files found, stopping:"; echo "$bad"; exit 1
          fi

      - name: Work out the tag
        id: tag
        env:
          TAG_IN: ${{ inputs.tag }}
        run: |
          version="$(tr -d ' \r\n' < launcher2/VERSION)"
          tag="${TAG_IN:-test-launcher-$version}"
          case "$tag" in test-*) ;; *) echo "Test tags must start with test-: $tag"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the release files (the branch's launcher2/release.sh)
        if: hashFiles('launcher2/release.sh') != ''
        run: |
          bash launcher2/release.sh "$RUNNER_TEMP/launcher" "${{ steps.tag.outputs.tag }}" "$GITHUB_REPOSITORY"
          mkdir -p "$RUNNER_TEMP/files"
          cp "$RUNNER_TEMP/launcher/files/"* "$RUNNER_TEMP/files/"

      - name: Build both launchers (branches from before release.sh)
        if: hashFiles('launcher2/release.sh') == ''
        run: |
          git submodule update --init --depth 1 recomp-ui
          launcher2/build.sh "$RUNNER_TEMP/launcher" both
          out="$RUNNER_TEMP/launcher/out"
          mkdir -p "$RUNNER_TEMP/files"
          cp "$out/windows/ACG1PLUS.exe" "$out/linux/ACG1PLUS" "$RUNNER_TEMP/files/"
          cd "$RUNNER_TEMP/files"
          sha256sum ACG1PLUS ACG1PLUS.exe > SHA256SUMS.txt

      - name: Make the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/files"
          ls -la
          cat SHA256SUMS.txt
          notes="$GITHUB_WORKSPACE/launcher2/test-notes.md"
          [ -f "$notes" ] || { echo "Test build of the launcher $VERSION from $REF." > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file "$notes" --prerelease -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * -R "$GITHUB_REPOSITORY" \
              --target "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" --prerelease \
              --title "TEST: launcher $VERSION" --notes-file "$notes"
          fi
          echo "Pre-release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
